name: iOS Build

# Builds the Offline app on a cloud Mac for every push and pull request,
# so compile errors are caught here before they ever reach a developer's Mac.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Offline.xcodeproj \
            -scheme Offline \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
