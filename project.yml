name: Offline
options:
  bundleIdPrefix: com.offline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID in Xcode

targets:
  Offline:
    type: application
    platform: iOS
    sources:
      - Offline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offline.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
    # XcodeGen generates the Info.plist at this path from the properties below.
    info:
      path: Offline/Info.plist
      properties:
        CFBundleDisplayName: Offline
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
